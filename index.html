<script type="module">
import * as GaussianSplats3D from '@mkkellogg/gaussian-splats-3d';
import * as THREE from 'three';

// 1A. Inisialisasi Scene Three.js & Engine Viewer Splat
const threeScene = new THREE.Scene();
const viewer = new GaussianSplats3D.Viewer({
    threeScene: threeScene,
    cameraUp: [0, 0, 1], // Sumbu Z sebagai arah atas
    sphericalHarmonicsDegree: 1 // Kualitas cahaya pantulan
});

// Mengambil path file .ksplat dari database PHP CI4
let path = '<?php echo base_url('datasplat/' . $selected_scene) ?>';
console.log('Path to the selected 3D scene:', path);

// Wadah Array untuk alat ukur (Titik, Bola, Garis, dan Label teks)
let measurementActive = false;
let points = [];
let spheres = [];
let lines = [];
let labels = [];

// Deteksi drag mouse untuk membedakan klik ukur vs geser kamera
let isMouseDragging = false;
let mouseDownPosition = null;
const mouseMoveTolerance = 5; 

// 1B. Memuat Scene & Auto-Center Camera
viewer.addSplatScene(path, {
    progressiveLoad: true, // Load bertahap agar browser tidak freeze
    showLoadingUI: true,
    gpuAcceleratedSort: true, // Akselerasi rendering menggunakan GPU
    sharedMemoryForWorkers: false,
})
.then(() => {
    // Algoritma menghitung volume bounding box dari titik splat
    const boundingBox = new THREE.Box3().setFromObject(threeScene);
    const boxCenter = boundingBox.getCenter(new THREE.Vector3());

    // Otomatis letakkan kamera 70 meter tegak lurus di atas objek
    const fixedDistance = 70; 
    viewer.camera.position.set(boxCenter.x, boxCenter.y, boxCenter.z + fixedDistance);
    viewer.camera.up.set(0, 0, 1); 
    viewer.camera.lookAt(boxCenter); // Menukik lihat ke bawah

    viewer.start();
    console.log('Scene loaded and viewer started successfully.');
})
.catch(error => {
    console.error('Error loading scene:', error);
});

// ==========================================
// SEGMENT 2: KONTROL TOMBOL PENGUKURAN
// ==========================================
const toggleMeasurementButton = document.getElementById('toggle-measurement');
const clearMeasurementsButton = document.getElementById('clear-measurements');

toggleMeasurementButton.addEventListener('click', () => {
    measurementActive = !measurementActive;
    if (measurementActive) {
        toggleMeasurementButton.textContent = 'Nonaktifkan Pengukuran';
        toggleMeasurementButton.style.backgroundColor = '#FF0000';
    } else {
        toggleMeasurementButton.textContent = 'Aktifkan Pengukuran';
        toggleMeasurementButton.style.backgroundColor = '#4CAF50';
    }
});

clearMeasurementsButton.addEventListener('click', clearAllMeasurements);

function clearAllMeasurements() {
    // Menghapus semua geometri yang menempel di scene Three.js
    points = [];
    spheres.forEach(sphere => threeScene.remove(sphere));
    lines.forEach(line => threeScene.remove(line));
    labels.forEach(label => threeScene.remove(label));

    spheres = [];
    lines = [];
    labels = [];

    if (areaLabel) { threeScene.remove(areaLabel); areaLabel = null; }
    if (closingLine) { threeScene.remove(closingLine); closingLine = null; }
    if (closingLineLabel) { threeScene.remove(closingLineLabel); closingLineLabel = null; }

    document.getElementById('measurements').innerHTML = ''; // Bersihkan panel UI
}

// ==========================================
// SEGMENT 3: ALGORITMA MATEMATIKA SPASIAL & GEOMETRI
// ==========================================

// Teorema Pythagoras 3D untuk Jarak
function calculateDistance(pointA, pointB) {
    const dx = pointB.x - pointA.x;
    const dy = pointB.y - pointA.y;
    const dz = pointB.z - pointA.z;
    return Math.sqrt(dx * dx + dy * dy + dz * dz).toFixed(3);
}

// Visualisasi Node Pengukuran (Titik Merah)
function createSphere(position) {
    const sphereGeometry = new THREE.SphereGeometry(0.02, 32, 32);
    const sphereMaterial = new THREE.MeshBasicMaterial({ color: 0xFF0000 });
    const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
    sphere.position.set(position.x, position.y, position.z);
    threeScene.add(sphere);
    return sphere;
}

let closingLine = null;

// Visualisasi Jarak (Garis Merah)
function createLine(pointA, pointB) {
    const lineMaterial = new THREE.LineBasicMaterial({ color: 0xFF0000 });
    const points = [pointA, pointB];
    const lineGeometry = new THREE.BufferGeometry().setFromPoints(points);
    const line = new THREE.Line(lineGeometry, lineMaterial);
    threeScene.add(line);
    return line;
}

// Konversi Teks HTML Canvas menjadi Material 3D (Billboard Sprite)
function createText(position, text) {
    const canvas = document.createElement('canvas');
    const context = canvas.getContext('2d');
    const fontSize = 2;
    const scaleFactor = 8; // Trik agar teks tidak pecah/blur saat di-zoom

    context.font = `${fontSize * scaleFactor}px Arial`;
    const textMetrics = context.measureText(text);
    const textWidth = Math.ceil(textMetrics.width);
    const textHeight = Math.ceil(fontSize * 1.2 * scaleFactor);

    canvas.width = textWidth;
    canvas.height = textHeight;

    context.font = `${fontSize * scaleFactor}px Arial`;
    context.fillStyle = 'white';
    context.textAlign = 'center';
    context.textBaseline = 'middle';

    context.clearRect(0, 0, canvas.width, canvas.height);
    context.fillText(text, canvas.width / 2, canvas.height / 2);

    const texture = new THREE.CanvasTexture(canvas);
    texture.minFilter = THREE.LinearFilter;
    texture.needsUpdate = true;

    const spriteMaterial = new THREE.SpriteMaterial({ map: texture });
    const sprite = new THREE.Sprite(spriteMaterial);

    sprite.scale.set((textWidth / scaleFactor) / 50, (textHeight / scaleFactor) / 50, 1);
    sprite.position.set(position.x, position.y, position.z);

    threeScene.add(sprite);
    return sprite;
}

let areaLabel = null; 
let closingLineLabel = null; 

// Menghitung Luas Poligon (Teorema Shoelace / Rumus Tali Sepatu)
function calculatePolygonArea(points) {
    if (points.length < 3) return 0; 
    let area = 0;
    for (let i = 0; i < points.length; i++) {
        const j = (i + 1) % points.length; // Looping silang X_i*Y_j - X_j*Y_i
        area += points[i].x * points[j].y - points[j].x * points[i].y;
    }
    return Math.abs(area) / 2;
}

// ==========================================
// SEGMENT 4: EVENT LISTENER MOUSE & RAYCASTING PENGUKURAN
// ==========================================

viewer.renderer.domElement.addEventListener('mousedown', (event) => {
    if (event.button === 0) {
        mouseDownPosition = { x: event.clientX, y: event.clientY };
        isMouseDragging = false;
    }
});

viewer.renderer.domElement.addEventListener('mousemove', (event) => {
    if (mouseDownPosition) {
        const dx = event.clientX - mouseDownPosition.x;
        const dy = event.clientY - mouseDownPosition.y;
        if (Math.sqrt(dx * dx + dy * dy) > mouseMoveTolerance) {
            isMouseDragging = true; // Jika mouse ditarik, jangan gambar titik
        }
    }
});

let offsetX = 0;
let offsetY = 0;
let offsetZ = 0;

// Apply Offset dari input UI
document.getElementById('apply-offset').addEventListener('click', () => {
    offsetX = parseFloat(document.getElementById('offset-x').value) || 0;
    offsetY = parseFloat(document.getElementById('offset-y').value) || 0;
    offsetZ = parseFloat(document.getElementById('offset-z').value) || 0;
    console.log(`Offsets applied: X=${offsetX}, Y=${offsetY}, Z=${offsetZ}`);
});

// Logika Klik (Draw Point & Calculate)
viewer.renderer.domElement.addEventListener('mouseup', (event) => {
    if (event.button === 0 && measurementActive && !isMouseDragging) {
        setTimeout(() => {
            const cameraLookAtPosition = viewer.controls ? viewer.controls.target : null;
            if (!cameraLookAtPosition) return;

            const targetPosition = cameraLookAtPosition.clone();
            points.push(targetPosition);
            spheres.push(createSphere(targetPosition));

            // Tampilkan label koordinat (Ditambah dengan Offset Referensi Bumi)
            const labelPosition = targetPosition.clone(); 
            labelPosition.z += 0.1; 

            const adjustedX = targetPosition.x + offsetX; 
            const adjustedY = targetPosition.y + offsetY;
            const adjustedZ = targetPosition.z + offsetZ;

            labels.push(
                createText(labelPosition, `(${adjustedX.toFixed(3)}, ${adjustedY.toFixed(3)}, ${adjustedZ.toFixed(3)})`)
            );

            // JIKA TITIK >= 2: Hitung dan gambar Jarak/Line
            if (points.length > 1) {
                const pointA = points[points.length - 2];
                const pointB = points[points.length - 1];
                const distance = calculateDistance(pointA, pointB);

                lines.push(createLine(pointA, pointB));

                const midPoint = new THREE.Vector3(
                    (pointA.x + pointB.x) / 2, (pointA.y + pointB.y) / 2, (pointA.z + pointB.z) / 2
                );

                labels.push(createText(midPoint, `D${points.length - 1}: ${distance} m`));

                const measurementsDiv = document.getElementById('measurements');
                const newMeasurement = document.createElement('p');
                newMeasurement.textContent = `D${points.length - 1}: ${distance} m`;
                measurementsDiv.appendChild(newMeasurement);
            }

            // JIKA TITIK > 2: Hitung Area dan tutup garis poligon
            if (points.length > 2) {
                if (closingLine) threeScene.remove(closingLine);
                closingLine = createLine(points[points.length - 1], points[0]);

                const closingDistance = calculateDistance(points[points.length - 1], points[0]);

                if (closingLineLabel) threeScene.remove(closingLineLabel);
                const closingMidPoint = new THREE.Vector3(
                    (points[points.length - 1].x + points[0].x) / 2,
                    (points[points.length - 1].y + points[0].y) / 2,
                    (points[points.length - 1].z + points[0].z) / 2
                );

                closingLineLabel = createText(closingMidPoint, `D${points.length}: ${closingDistance} m`);

                const measurementsDiv = document.getElementById('measurements');
                const closingMeasurement = document.createElement('p');
                closingMeasurement.textContent = `D${points.length}: ${closingDistance} m`;

                const existingClosingMeasurement = measurementsDiv.querySelector('.closing-measurement');
                if (existingClosingMeasurement) {
                    measurementsDiv.removeChild(existingClosingMeasurement);
                }

                closingMeasurement.classList.add('closing-measurement');
                measurementsDiv.appendChild(closingMeasurement);

                if (areaLabel) threeScene.remove(areaLabel);
                const area = calculatePolygonArea(points);

                // Mencari Center of Mass (Titik tengah area poligon)
                const centroid = points.reduce(
                    (acc, point) => acc.add(point), new THREE.Vector3()
                ).divideScalar(points.length);

                areaLabel = createText(centroid, `Area: ${area.toFixed(3)} m²`);
            }
        }, 500); // Delay agar algoritma raycasting selesai
    }

    mouseDownPosition = null;
    isMouseDragging = false;
});

// ==========================================
// SEGMENT 5: PARSING XML & TRANSFORMASI PROJ4JS
// ==========================================

// Inisialisasi Proj4js (Sistem Referensi Offline)
proj4.defs("EPSG:4978", "+proj=geocent +datum=WGS84 +units=m +no_defs"); // ECEF dari Metashape
proj4.defs("EPSG:4326", "+proj=longlat +datum=WGS84 +no_defs");
proj4.defs("EPSG:32749", "+proj=utm +zone=49 +south +datum=WGS84 +units=m +no_defs");
proj4.defs("EPSG:3857", "+proj=merc +a=6378137 +b=6378137 +lat_ts=0.0 +lon_0=0.0 +x_0=0.0 +y_0=0 +k=1.0 +units=m +nadgrids=@null +wktext +no_defs");
proj4.defs("EPSG:32633", "+proj=utm +zone=33 +datum=WGS84 +units=m +no_defs");

// Fungsi Transfromasi Offline
async function transformCoordinates(x, y, z, targetEPSG) {
    const sourceProj = "EPSG:4978";
    const targetProj = "EPSG:" + targetEPSG;

    if (!proj4.defs[targetProj]) {
        throw new Error(`Sistem Koordinat EPSG:${targetEPSG} belum didaftarkan.`);
    }

    const point = [x, y, z];
    const transformed = proj4(sourceProj, targetProj, point);

    return { x: transformed[0], y: transformed[1], z: transformed[2] || 0 };
}

document.getElementById('epsg-select').addEventListener('change', function () {
    const manualContainer = document.getElementById('manual-epsg-container');
    if (this.value === 'manual') {
        manualContainer.style.display = 'block';
    } else {
        manualContainer.style.display = 'none';
    }
});

// Logika Membaca File XML Agisoft Metashape
document.getElementById('process-xml').addEventListener('click', async function () {
    const fileInput = document.getElementById('import-xml');
    const epsgSelect = document.getElementById('epsg-select');
    const manualEpsgInput = document.getElementById('manual-epsg');
    const translationValues = document.getElementById('translation-values');
    const xValue = document.getElementById('translation-x');
    const yValue = document.getElementById('translation-y');
    const zValue = document.getElementById('translation-z');
    const offsetXInput = document.getElementById('offset-x');
    const offsetYInput = document.getElementById('offset-y');

    if (fileInput.files.length === 0) {
        alert('Silakan pilih file XML terlebih dahulu!');
        return;
    }

    let targetEPSG = epsgSelect.value;
    if (targetEPSG === 'manual') {
        targetEPSG = manualEpsgInput.value;
        if (!targetEPSG) {
            alert('Silakan masukkan EPSG secara manual!');
            return;
        }
    }

    const file = fileInput.files[0];
    const reader = new FileReader();

    reader.onload = async function (event) {
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(event.target.result, 'text/xml');

        // Ekstrak tag <translation> dari struktur XML
        const translation = xmlDoc.querySelector('translation');
        if (translation) {
            const values = translation.textContent.split(' ');
            const x = parseFloat(values[0]);
            const y = parseFloat(values[1]);
            const z = parseFloat(values[2]);

            try {
                // Lakukan transformasi dan inject hasilnya ke UI Pengukuran
                const transformed = await transformCoordinates(x, y, z, targetEPSG);
                
                xValue.textContent = transformed.x.toFixed(6);
                yValue.textContent = transformed.y.toFixed(6);
                zValue.textContent = transformed.z ? transformed.z.toFixed(6) : '-';

                offsetXInput.value = transformed.x.toFixed(6);
                offsetYInput.value = transformed.y.toFixed(6);

                translationValues.style.display = 'block';
            } catch (error) {
                console.error("Error Transformasi:", error);
                alert('Gagal melakukan transformasi koordinat: ' + error.message);
            }
        } else {
            alert('Tag <translation> tidak ditemukan dalam file XML.');
        }
    };

    reader.onerror = function () {
        alert('Gagal membaca file XML.');
    };

    reader.readAsText(file); // Trigger pembacaan File
});

// Tombol shortcut untuk menerapkan hasil XML ke Offset
document.getElementById('apply-offset').addEventListener('click', function () {
    const xValue = document.getElementById('translation-x');
    const yValue = document.getElementById('translation-y');
    const offsetX = parseFloat(document.getElementById('offset-x').value);
    const offsetY = parseFloat(document.getElementById('offset-y').value);

    if (!isNaN(offsetX)) xValue.textContent = (parseFloat(xValue.textContent) + offsetX).toFixed(3);
    if (!isNaN(offsetY)) yValue.textContent = (parseFloat(yValue.textContent) + offsetY).toFixed(3);

    alert('Offset berhasil diterapkan!');
});

</script>
